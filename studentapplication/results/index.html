<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Admission Results</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root{
      --blue:#3057A4;
      --blue-dark:#274b8a;
      --ink:#0f2544;
      --muted:#59667a;
      --border:#d6def0;
      --soft:#f5f7fb;
      --green:#12805c;
      --green-bg:#e8f7ef;
      --red:#b42318;
      --red-bg:#fff0ee;
      --amber:#936b00;
      --amber-bg:#fff6db;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial, sans-serif;
      padding:36px 16px;
      color:var(--ink);
      line-height:1.5;
      background:#fff;
    }
    .wrap{max-width:880px;margin:0 auto}
    .result{
      position:relative;
      overflow:hidden;
      text-align:center;
      padding:34px 28px 32px;
      border:1px solid var(--border);
      border-radius:20px;
      background:#fff;
      box-shadow:0 10px 30px rgba(48,87,164,.10);
    }
    .result:before{
      content:"";
      position:absolute;
      inset:0;
      background-image:url("https://beta.viewpoint.me/wp-content/uploads/2025/10/View-others-succeeding-1024x620.png");
      background-size:cover;
      background-position:center;
      filter:blur(11px) saturate(.78) brightness(1.04);
      opacity:.24;
      transform:scale(1.08);
    }
    .result:after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,.88));
    }
    .result > *{
      position:relative;
      z-index:1;
    }
    .result-icon{
      width:64px;
      height:64px;
      margin:0 auto 18px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      animation:pop .35s ease-out forwards;
    }
    .result-icon svg{
      width:38px;
      height:38px;
      opacity:0;
      transform:scale(.6);
      animation:grow .35s ease-out .18s forwards;
    }
    .result-icon.admitted,
    .result-icon.training{background:var(--green-bg);color:var(--green)}
    .result-icon.denied{background:var(--red-bg);color:var(--red)}
    .result-icon.locked{background:#eef2ff;color:var(--blue)}
    @keyframes pop{0%{transform:scale(.2);opacity:0}90%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
    @keyframes grow{to{opacity:1;transform:scale(1)}}
    h1{
      margin:0 0 8px;
      color:var(--blue);
      font-size:clamp(30px,5vw,38px);
      line-height:1.12;
    }
    .sub{
      margin:0 auto 22px;
      color:#4b5870;
      font-size:16px;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      margin:0 0 32px;
      padding:8px 14px;
      border-radius:999px;
      font-size:14px;
      font-weight:700;
    }
    .pill:before{
      content:"";
      width:8px;
      height:8px;
      border-radius:50%;
      background:currentColor;
    }
    .pill.admitted{background:var(--green-bg);color:var(--green)}
    .pill.denied{background:var(--red-bg);color:var(--red)}
    .pill.training{background:var(--green-bg);color:var(--green)}
    .pill.locked{background:#eef2ff;color:var(--blue)}
    .timeline{
      max-width:500px;
      margin:0 auto 10px;
      display:grid;
      grid-template-columns:repeat(4, 1fr);
      position:relative;
    }
    .timeline:before{
      content:"";
      position:absolute;
      left:12.5%;
      right:12.5%;
      top:11px;
      height:2px;
      background:#d7e0f2;
    }
    .timeline:after{
      content:"";
      position:absolute;
      left:12.5%;
      width:50%;
      top:11px;
      height:2px;
      background:var(--blue);
    }
    .step{
      position:relative;
      z-index:1;
      color:#697386;
      font-size:12px;
      font-weight:700;
      line-height:1.15;
    }
    .dot{
      width:24px;
      height:24px;
      margin:0 auto 8px;
      border-radius:50%;
      border:2px solid var(--blue);
      background:#fff;
    }
    .step.done .dot,
    .step.active .dot{background:var(--blue)}
    .result-copy{
      margin:0 auto;
      max-width:640px;
      color:var(--ink);
      font-size:16px;
    }
    .note{
      margin:22px auto 0;
      padding:14px 16px;
      border-radius:12px;
      background:var(--soft);
      color:var(--ink);
      font-size:14px;
      text-align:left;
    }
    .trust{
      margin:12px auto 0;
      color:var(--muted);
      font-size:13px;
    }
    .actions{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:12px;
      margin-top:24px;
    }
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:42px;
      padding:10px 20px;
      border:1px solid transparent;
      border-radius:999px;
      background:var(--blue);
      color:#fff;
      cursor:pointer;
      font-family:inherit;
      font-size:14px;
      font-weight:700;
      text-decoration:none;
    }
    .btn:hover{background:var(--blue-dark)}
    .btn.secondary{
      background:#fff;
      border-color:#cdd5ff;
      color:var(--blue);
    }
    .btn.secondary:hover{background:#f7f9ff}
    .unlock{
      display:grid;
      grid-template-columns:minmax(0, 1fr) auto;
      gap:10px;
      margin:18px auto 0;
      max-width:520px;
    }
    input{
      width:100%;
      min-height:42px;
      border:1px solid #cfd7e6;
      border-radius:999px;
      color:var(--ink);
      font:inherit;
      outline:none;
      padding:0 16px;
    }
    input:focus{
      border-color:var(--blue);
      box-shadow:0 0 0 3px rgba(48,87,164,.14);
    }
    .error{
      display:none;
      margin:10px 0 0;
      color:var(--red);
      font-size:13px;
      font-weight:700;
    }
    @media (max-width:700px){
      body{padding:24px 12px}
      .result{padding:28px 18px 26px}
      .timeline{margin-inline:-4px}
      .step{font-size:11px}
      .unlock{grid-template-columns:1fr}
      .btn{width:100%}
    }
  </style>
</head>
<body>
  <main class="wrap result">
    <div class="result-icon locked" id="statusIcon" aria-hidden="true"></div>
    <h1>Admission results</h1>
    <p class="sub" id="subtitle">Enter the reveal code or speak with your advisor.</p>
    <div class="pill locked" id="statusPill">Concealed</div>

    <div class="timeline" aria-label="Application progress">
      <div class="step done"><div class="dot" aria-hidden="true"></div>Student<br>Applied</div>
      <div class="step done"><div class="dot" aria-hidden="true"></div>Reference<br>Contacted</div>
      <div class="step active"><div class="dot" aria-hidden="true"></div>Acceptance<br>Results</div>
      <div class="step"><div class="dot" aria-hidden="true"></div>Enroll</div>
    </div>
    <div id="resultArea"></div>
  </main>

  <script>
    const qs = new URLSearchParams(location.search);
    const statusParam = (qs.get("s") || "").trim();
    const revealParam = (qs.get("r") || "0").trim();
    const fundParam = (qs.get("fund") || "0").trim();
    const fundUrlRaw = (qs.get("fundurl") || "").trim();
    const first = (qs.get("first") || qs.get("name") || "").trim();
    const programParam = (qs.get("program") || qs.get("course") || "").trim();
    const term = (qs.get("term") || "basic computer training").trim();
    const deadline = (qs.get("deadline") || qs.get("by") || "").trim();
    const advisor = (qs.get("advisor") || "your advisor").trim();
    const phone = (qs.get("phone") || "+1 (212) 989-7177 ext. 5").trim();
    const email = (qs.get("email") || "classroom@viewpointlearn.com").trim();
    const revealCode = (qs.get("c") || qs.get("code") || "").trim();
    if(revealCode){
      const cleanUrl = new URL(location.href);
      cleanUrl.searchParams.delete("c");
      cleanUrl.searchParams.delete("code");
      history.replaceState(null, "", cleanUrl.toString());
    }
    const text = value => String(value).replace(/[&<>'"]/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[char]));
    const mail = value => encodeURIComponent(value).replace(/%20/g,"+");
    const cleanPhone = value => value.replace(/[^+\d]/g, "");
    const programPhrase = programParam
      ? "the " + programParam + (/program$/i.test(programParam) ? "" : " program")
      : "";
    const resultSubtitle = word => programPhrase
      ? "You're " + word + " to " + programPhrase + "."
      : "You're " + word + " to your selected program.";
    const deniedSubtitle = () => programPhrase
      ? "We are not able to move forward with admission to " + programPhrase + " at this time."
      : "We are not able to move forward with admission at this time.";
    const isFundingStep = fundParam === "1" || fundParam.toLowerCase() === "true";
    const safeFundUrl = (() => {
      if(!fundUrlRaw) return "";
      try{
        const url = new URL(fundUrlRaw, location.href);
        return url.protocol === "http:" || url.protocol === "https:" ? url.href : "";
      }catch(_){
        return "";
      }
    })();
    const icons = {
      admitted:'<svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
      denied:'<svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
      locked:'<svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>'
    };

    const statuses = {
      "0": {
        key:"denied",
        icon:"denied",
        label:"Denied",
        subtitle:deniedSubtitle(),
        copy:"If you believe this result was shown in error, please contact the Admission Team."
      },
      "1": {
        key:"admitted",
        icon:"admitted",
        label:"Admitted",
        subtitle:resultSubtitle("admitted"),
        copy:"You're almost finished. Complete the next step to keep your enrollment moving."
      },
      "1.1": {
        key:"training",
        icon:"admitted",
        label:"Accepted, one prep step remains",
        subtitle:resultSubtitle("accepted"),
        copy:"You're in. Your advisor will guide the " + term + " step before the final class track opens."
      }
    };

    const selected = statuses[statusParam] || statuses["1"];
    const shouldReveal = revealParam === "1" || revealParam.toLowerCase() === "true";
    const resultArea = document.getElementById("resultArea");
    const statusIcon = document.getElementById("statusIcon");
    const statusPill = document.getElementById("statusPill");
    const subtitle = document.getElementById("subtitle");
    let celebrated = false;

    function primaryAction(){
      if(isFundingStep && selected.key !== "denied"){
        return {
          label:"Secure my spot",
          href:safeFundUrl || "tel:" + cleanPhone(phone)
        };
      }
      return {
        label:"Contact Admission Team",
        href:"mailto:" + email + "?subject=" + mail("Application Results Question")
      };
    }

    function renderResult(){
      const usesFunding = isFundingStep && selected.key !== "denied";
      const primary = primaryAction();
      const resultCopy = usesFunding && selected.key === "admitted"
        ? ""
        : usesFunding && selected.key === "training"
          ? "Your advisor will guide the " + term + " step before the final class track opens."
          : selected.copy;
      const nextStepNote = usesFunding
        ? deadline
          ? "Next step: Continue funding by " + deadline + " to secure your spot."
          : "Next step: Continue funding to secure your spot."
        : "Next step: Your advisor can help confirm your schedule, payment status, and start details.";
      const trustLine = usesFunding
        ? '<p class="trust">Your advisor can help if anything is unclear.</p>'
        : "";
      statusIcon.className = "result-icon " + selected.key;
      statusIcon.innerHTML = icons[selected.icon];
      statusPill.className = "pill " + selected.key;
      statusPill.textContent = selected.label;
      subtitle.textContent = selected.subtitle;
      resultArea.innerHTML =
        (resultCopy ? '<p class="result-copy">' + text(resultCopy) + '</p>' : '') +
        '<div class="note">' + text(nextStepNote) + '</div>' +
        '<div class="actions">' +
          '<a class="btn" href="' + text(primary.href) + '">' + text(primary.label) + '</a>' +
          '<a class="btn secondary" href="tel:' + cleanPhone(phone) + '">Call Advisor</a>' +
        '</div>' +
        trustLine;
      celebrateIfAccepted();
    }

    function celebrateIfAccepted(){
      if(celebrated || selected.key === "denied" || typeof confetti !== "function") return;
      celebrated = true;
      confetti({ particleCount: 85, spread: 55, origin: { y: 0.7 } });
    }

    function renderLocked(){
      statusIcon.className = "result-icon locked";
      statusIcon.innerHTML = icons.locked;
      statusPill.className = "pill locked";
      statusPill.textContent = "Concealed";
      subtitle.textContent = "Enter the reveal code or speak with " + advisor + ".";
      resultArea.innerHTML =
        '<p class="result-copy">For privacy, this result is currently concealed.</p>' +
        '<div class="unlock">' +
          '<input id="codeInput" autocomplete="one-time-code" inputmode="text" placeholder="Reveal code" aria-label="Reveal code">' +
          '<button class="btn" id="unlockBtn" type="button">Reveal</button>' +
        '</div>' +
        '<p class="error" id="errorText">That code did not match. Please try again or talk to your advisor.</p>' +
        '<div class="actions">' +
          '<a class="btn secondary" href="mailto:' + text(email) + '?subject=' + mail('Application Results Reveal Code') + '">Talk to Admission Team</a>' +
        '</div>';
      document.getElementById("unlockBtn").addEventListener("click", tryUnlock);
      document.getElementById("codeInput").addEventListener("keydown", event => { if(event.key === "Enter") tryUnlock(); });
    }

    function tryUnlock(){
      const input = document.getElementById("codeInput").value.trim();
      if(revealCode && input === revealCode){
        const next = new URL(location.href);
        next.searchParams.set("r", "1");
        next.searchParams.delete("c");
        next.searchParams.delete("code");
        history.replaceState(null, "", next.toString());
        renderResult();
        return;
      }
      document.getElementById("errorText").style.display = "block";
    }

    if(shouldReveal){ renderResult(); } else { renderLocked(); }
  </script>
</body>
</html>
